services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-testlab_shop}
      MARIADB_USER: ${DB_USER:-testlab_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=tcp -h127.0.0.1 -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-testlab_shop}
      DB_USER: ${DB_USER:-testlab_app}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV:-local}
      ENABLE_TEST_API: ${ENABLE_TEST_API:-false}
      TEST_API_KEY: ${TEST_API_KEY:-}
      FAULT_MODE: ${FAULT_MODE:-none}
      API_DELAY_MS: ${API_DELAY_MS:-0}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  database_data:
